[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fds-topic9"
version = "1.0.0"
description = "Experiments on neural-network capacity and generalization for MAC 312"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "threadpoolctl>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
